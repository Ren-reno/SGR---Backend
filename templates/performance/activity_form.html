{% extends "base.html" %}
{% block title %}{{ page_title }}{% endblock %}
{% block content %}
  <div class="card">
    <h1>{{ page_title }}</h1>
    <form method="post" novalidate>
      {% csrf_token %}
      {% include "performance/partials/form_fields.html" %}
      <button type="submit" class="btn">Guardar</button>
      <a class="btn-secondary" href="{% url 'performance:activity_list' %}">Cancelar</a>
    </form>
  </div>
{% endblock %}
